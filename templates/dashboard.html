<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-card {
            max-width: 1200px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .worker-card {
            border-left: 4px solid #28a745;
            transition: transform 0.2s;
        }
        .worker-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .status-badge {
            font-size: 1.1rem;
            padding: 8px 15px;
        }
        .refresh-notice {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .no-workers {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .worker-icon {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card dashboard-card">
            <div class="card-body p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>🤖 Worker Dashboard</h1>
                    <div>
                        <a href="/" class="btn btn-outline-primary">← Back to Upload</a>
                    </div>
                </div>
                
                <div class="alert alert-info refresh-notice">
                    🔄 Auto-refreshing every 3 seconds
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card text-center bg-success text-white">
                            <div class="card-body">
                                <h3 id="activeCount">0</h3>
                                <p class="mb-0">Active Workers</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center bg-info text-white">
                            <div class="card-body">
                                <h3>🔧</h3>
                                <p class="mb-0">Kafka Broker</p>
                                <small>172.23.54.181</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center bg-warning text-white">
                            <div class="card-body">
                                <h3>💾</h3>
                                <p class="mb-0">Redis Store</p>
                                <small>172.23.150.205</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <h3 class="mb-3">Active Workers</h3>
                <div id="workersList" class="row g-3">
                    <!-- Workers will be loaded here -->
                </div>
                
                <div id="noWorkers" class="no-workers d-none">
                    <div class="worker-icon">😴</div>
                    <h4>No Active Workers</h4>
                    <p>Start workers to see them here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval;
        
        // Load workers
        async function loadWorkers() {
            try {
                const response = await fetch('/api/workers');
                const data = await response.json();
                
                const workersList = document.getElementById('workersList');
                const noWorkers = document.getElementById('noWorkers');
                const activeCount = document.getElementById('activeCount');
                
                if (data.workers && data.workers.length > 0) {
                    workersList.innerHTML = '';
                    noWorkers.classList.add('d-none');
                    
                    activeCount.textContent = data.workers.length;
                    
                    data.workers.forEach(worker => {
                        const workerCard = document.createElement('div');
                        workerCard.className = 'col-md-6';
                        workerCard.innerHTML = `
                            <div class="card worker-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <h5 class="card-title">🤖 ${worker.worker_id}</h5>
                                            <p class="card-text text-muted mb-0">
                                                TTL: ${worker.ttl} seconds
                                            </p>
                                        </div>
                                        <span class="badge bg-success status-badge">
                                            ✓ ${worker.status}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                        workersList.appendChild(workerCard);
                    });
                } else {
                    workersList.innerHTML = '';
                    noWorkers.classList.remove('d-none');
                    activeCount.textContent = '0';
                }
                
            } catch (error) {
                console.error('Error loading workers:', error);
            }
        }
        
        // Initial load
        loadWorkers();
        
        // Auto-refresh every 3 seconds
        refreshInterval = setInterval(loadWorkers, 3000);
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
