<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Image Processing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            max-width: 800px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .progress-section {
            display: none;
            margin-top: 20px;
        }
        .result-section {
            display: none;
            margin-top: 20px;
        }
        .logo {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .btn-upload:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .result-img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card main-card">
            <div class="card-body p-5">
                <div class="logo">🖼️ 🔧</div>
                <h1 class="text-center mb-4">Distributed Image Processing</h1>
                <p class="text-center text-muted mb-4">Upload an image and select a transformation</p>
                
                <!-- Upload Form -->
                <div id="uploadSection">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label for="imageFile" class="form-label">Select Image</label>
                            <input class="form-control form-control-lg" type="file" id="imageFile" 
                                   accept="image/*" required>
                            <div class="form-text">Supported: PNG, JPG, JPEG, BMP, TIFF (min 1024x1024)</div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Transformation Type</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="transformation" 
                                       id="grayscale" value="grayscale" checked>
                                <label class="form-check-label" for="grayscale">
                                    <strong>Grayscale</strong> - Convert to black and white
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="transformation" 
                                       id="blur" value="blur">
                                <label class="form-check-label" for="blur">
                                    <strong>Blur</strong> - Apply Gaussian blur effect
                                </label>
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-upload btn-lg">
                                🚀 Start Processing
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Progress Section -->
                <div id="progressSection" class="progress-section">
                    <div class="text-center mb-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <h4 class="text-center mb-3">Processing your image...</h4>
                    <div class="progress mb-3" style="height: 30px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%">0%</div>
                    </div>
                    <p class="text-center text-muted">
                        <span id="tilesProcessed">0</span> / <span id="tilesTotal">0</span> tiles processed
                    </p>
                    <p class="text-center">
                        <small class="text-muted">Job ID: <code id="jobId"></code></small>
                    </p>
                </div>
                
                <!-- Result Section -->
                <div id="resultSection" class="result-section">
                    <h4 class="text-center mb-3">✨ Processing Complete!</h4>
                    <div class="text-center mb-3">
                        <img id="resultImage" class="result-img" src="" alt="Processed Image">
                    </div>
                    <div class="d-grid gap-2">
                        <a id="downloadBtn" href="#" class="btn btn-success btn-lg" download>
                            📥 Download Processed Image
                        </a>
                        <button onclick="location.reload()" class="btn btn-secondary">
                            🔄 Process Another Image
                        </button>
                        <a href="/dashboard" class="btn btn-outline-primary">
                            📊 View Worker Dashboard
                        </a>
                    </div>
                </div>
                
                <!-- Error Alert -->
                <div id="errorAlert" class="alert alert-danger d-none mt-3" role="alert">
                    <strong>Error:</strong> <span id="errorMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const uploadSection = document.getElementById('uploadSection');
        const progressSection = document.getElementById('progressSection');
        const resultSection = document.getElementById('resultSection');
        const errorAlert = document.getElementById('errorAlert');
        
        let currentJobId = null;
        let pollInterval = null;
        
        // Handle form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset UI
            errorAlert.classList.add('d-none');
            uploadSection.style.display = 'none';
            progressSection.style.display = 'block';
            resultSection.style.display = 'none';
            
            // Get form data
            const formData = new FormData();
            const fileInput = document.getElementById('imageFile');
            const transformation = document.querySelector('input[name="transformation"]:checked').value;
            
            formData.append('file', fileInput.files[0]);
            formData.append('transformation', transformation);
            
            try {
                // Upload image
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Upload failed');
                }
                
                // Start polling for status
                currentJobId = data.job_id;
                document.getElementById('jobId').textContent = currentJobId;
                document.getElementById('tilesTotal').textContent = data.total_tiles;
                
                pollStatus();
                
            } catch (error) {
                showError(error.message);
                uploadSection.style.display = 'block';
                progressSection.style.display = 'none';
            }
        });
        
        // Poll job status
        function pollStatus() {
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${currentJobId}`);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to get status');
                    }
                    
                    // Update progress
                    const progress = (data.processed_count / data.total_tiles) * 100;
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('progressBar').textContent = Math.round(progress) + '%';
                    document.getElementById('tilesProcessed').textContent = data.processed_count;
                    
                    // Check if complete
                    if (data.status === 'complete') {
                        clearInterval(pollInterval);
                        showResult();
                    } else if (data.status === 'error') {
                        clearInterval(pollInterval);
                        showError('Processing failed');
                        uploadSection.style.display = 'block';
                        progressSection.style.display = 'none';
                    }
                    
                } catch (error) {
                    clearInterval(pollInterval);
                    showError(error.message);
                    uploadSection.style.display = 'block';
                    progressSection.style.display = 'none';
                }
            }, 1000); // Poll every second
        }
        
        // Show result
        function showResult() {
            progressSection.style.display = 'none';
            resultSection.style.display = 'block';
            
            const resultUrl = `/result/${currentJobId}`;
            document.getElementById('resultImage').src = resultUrl;
            document.getElementById('downloadBtn').href = resultUrl;
        }
        
        // Show error
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            errorAlert.classList.remove('d-none');
        }
    </script>
</body>
</html>
